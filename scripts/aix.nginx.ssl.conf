server {
    listen 80;
    listen [::]:80;
    listen 8080;
    listen [::]:8080;
    server_name aixai.pro www.aixai.pro _;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://aixai.pro$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.aixai.pro;

    ssl_certificate /etc/letsencrypt/live/aixai.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aixai.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://aixai.pro$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aixai.pro;
    client_max_body_size 20m;

    ssl_certificate /etc/letsencrypt/live/aixai.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aixai.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    root /opt/aix/www;
    index index.html;

    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /admin/js/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /admin/css/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # 站点图标必须返回真实图片。缺文件时不要回退到 index.html，
    # 否则浏览器会把 HTML 当成 /favicon.ico 缓存，标签页图标一直空白。
    location = /favicon.ico {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "public, max-age=604800" always;
        default_type image/vnd.microsoft.icon;
        try_files $uri =404;
    }

    location = /favicon.png {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # 入口 HTML 禁止缓存。钱包 WebView 若缓存了旧 index.html，会一直加载旧 JS。
    location = /index.html {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location = /admin/index.html {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location = / {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
