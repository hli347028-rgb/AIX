server:
  http:
    addr: 0.0.0.0:9000
    timeout: 5s
  grpc:
    addr: 0.0.0.0:9100
    timeout: 5s
data:
  database:
    driver: mysql
    host: 127.0.0.1
    port: 3306
    user: aix
    password: "replace-with-a-strong-database-password"
    dbname: aix
  redis:
    addr: 127.0.0.1:6379
    read_timeout: 0.2s
    write_timeout: 0.2s
auth:
  jwt_secret: "replace-with-a-long-random-secret"
  bootstrap_addresses:
    - "0x0000000000000000000000000000000000000000"
  admin_addresses:
    - "0x0000000000000000000000000000000000000000"
  admin_account: admin
  admin_password: "replace-with-a-strong-admin-password"
  admin_sub_accounts:
    - account: user1
      password: user1
      modules: []  # 留空=全部常规模块；示例: ["/home", "/member"]
    - account: user2
      password: user2
      modules: []
    - account: user3
      password: user3
      modules: []
  challenge_ttl: 5m
  # 第三方 Open API 密钥（可配置多个）；请求头 X-API-Key: <key>
  open_api_keys:
    - "replace-with-open-api-key"
wallet:
  deposit_contract: "0xa5A438Bb1D0F702c684B4d7bAAE2C520aFb4aE86"
  # 原生 WIN 充值合约（BuySomething payable）
  win_deposit_contract: "0x94db6bb040107ef9a2F1e9DB9d84dD8D6D98997e"
  win_a_deposit_contract: "0xcaa39A8E23F5548AD85d9e2B9B21F63E99505040"
  # WIN-A 链上充值开关；false 时用户端显示暂未开放且不入账
  win_a_recharge_enabled: true
  deposit_address: "replace-with-your-deposit-address"
  deposit_addresses:
    - "replace-with-your-deposit-address"
  usdt_contract: "0x926632975149221891f1b9B56Efd125Dfe90ba2f"
  usdt_decimals: 18
  # WIN ERC20 合约（用于 WIN 充值链上校验）；留空时仅允许管理端人工入账 / 开发模式
  win_contract: ""
  win_decimals: 18
  # WIN-A ERC20 代币合约
  win_a_contract: "0x3dce8Ef2646e3082f1e4afbC26Cf747e4e238A8D"
  win_a_decimals: 18
  sdt_contract: "0x314D550572a0fA001B465a9EBc1dd04D834a0688"
  sdt_decimals: 18
  rpc_url: "https://rpc1.eoeo.info"
  # BSC RPC（USDT BuySomething 充值扫描）
  bsc_rpc_url: "https://bsc-dataseed.binance.org"
  # 进程内充值轮询。改用 crontab 时必须为 false，否则会与 cron 重复扫链。
  # false 时仍可通过 GET /api/admin_dhb/deposit_only 与 deposit_only_win 触发（幂等）。
  recharge_monitor_enabled: false
  # 每60秒启动一轮；每轮查询10次，相邻查询间隔5秒。（仅 recharge_monitor_enabled=true 时生效）
  recharge_scan_interval_seconds: 60
  recharge_scan_queries_per_cycle: 10
  recharge_scan_query_interval_seconds: 5
  recharge_confirmations: 3
  # 仅首次启动且尚无持久化游标时使用；0 表示从最新安全区块向前回看。
  recharge_scan_start_block: 0
  recharge_scan_lookback_blocks: 5000
  recharge_scan_batch_blocks: 1000
  min_subscribe: "100"
  min_withdraw: "10"
  withdraw_fee_rate: 0.06
  # WinSwap V2 Pair（WWIN/USDT）链上 WIN 价格预言机
  win_pair: "0x15ad085fc866370b59936575565434b14d22281d"
  # 进程内价格轮询。改用 crontab 时必须为 false，与 cron 互斥。
  # false 时仍可通过 GET /api/admin_dhb/win_price_oracle 触发。
  win_price_oracle_enabled: false
  # 以下仅 win_price_oracle_enabled=true 时生效
  win_price_poll_seconds: 60
  win_price_queries_per_cycle: 10
  win_price_query_interval_seconds: 5
  # WIN / AIX-USDT 提现自动打款共用 withdraw.key（勿提交到 git）
  withdraw_payout_enabled: true
  withdraw_private_key_file: "/opt/aix/secrets/withdraw.key"
  withdraw_payout_queries_per_cycle: 10
  withdraw_payout_query_interval_seconds: 5
  # AVE Cloud Data API（首页 K 线 GET /v1/market/kline）
  # 密钥优先读环境变量 AVE_API_KEY，其次 ave_api_key_file，勿提交到 git
  # ave_api_key_file: "/opt/aix/secrets/ave_api.key"
  ave_kline_base_url: "https://prod.ave-api.com"
  ave_kline_token_id: "0x193013574dacbd38bf26ecb654b3fd787b94d216-winchain"
