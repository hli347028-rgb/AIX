server:
  http:
    addr: 0.0.0.0:9000
    timeout: 5s
  grpc:
    addr: 0.0.0.0:9100
    timeout: 5s
data:
  database:
    driver: mysql
    host: 127.0.0.1
    port: 3306
    user: root
    password: root
    dbname: aix
  redis:
    addr: 127.0.0.1:6379
    read_timeout: 0.2s
    write_timeout: 0.2s
auth:
  jwt_secret: "******"
  bootstrap_addresses:
    - "0x0000000000000000000000000000000000000000"
  admin_addresses:
    - "0x0000000000000000000000000000000000000000"
  admin_account: admin
  admin_password: "******"
  admin_sub_accounts:
    - account: user1
      password: user1
      modules: []  # 留空=全部常规模块；可填: /home /member /recharge /withdrawList /subscription /ordersList /config /exchangeList /transferList /settlement /news
    - account: user2
      password: user2
      modules: []
    - account: user3
      password: user3
      modules: []
  challenge_ttl: 5m
  open_api_keys:
    - "******"
# 合作方转账加款接口 POST /v1/transfer/credit（HMAC-SHA256 双向签名）
# 与 auth.open_api_keys 是两套独立认证，不可混用。
# 密钥一律放在 secret_keys_file 指向的文件里（每行一把，支持轮换期并行），
# 严禁写进本文件——config.yaml 受 git 跟踪。
transfer_partners:
  timestamp_skew: 300s
  ip_rate_limit_per_sec: 20
  partners:
    - partner_id: "AIX10001"
      enabled: true
      secret_keys_file: "configs/secrets/partner-AIX10001.test.key"
      # 三个限额留空 = 使用管理端「配置项」里的全局值（可热改，无需重启）。
      # 仅当某个合作方需要区别于全局的限额时才在这里填值覆盖。
      min_amount: ""
      max_amount: ""
      daily_limit: ""
      rate_limit_per_sec: 10
wallet:
  deposit_contract: "0xa5A438Bb1D0F702c684B4d7bAAE2C520aFb4aE86"
  win_deposit_contract: "0x94db6bb040107ef9a2F1e9DB9d84dD8D6D98997e"
  win_a_deposit_contract: "0xcaa39A8E23F5548AD85d9e2B9B21F63E99505040"
  deposit_address: "0xB8726F15099956183C3a0431791458A096404Ca6"
  deposit_addresses:
    - "0xB8726F15099956183C3a0431791458A096404Ca6"
    - "0x9e3730f324476C15b9CF1B1991E0c2CC5C8d1575"
  usdt_contract: "0x926632975149221891f1b9B56Efd125Dfe90ba2f"  # EOEO USDT
  usdt_decimals: 18
  rpc_url: "https://rpc1.eoeo.info"
  bsc_rpc_url: "https://bsc-dataseed.binance.org"
  recharge_monitor_enabled: true
  recharge_scan_interval_seconds: 60
  recharge_scan_queries_per_cycle: 10
  recharge_scan_query_interval_seconds: 5
  recharge_confirmations: 3
  recharge_scan_start_block: 0
  recharge_scan_lookback_blocks: 5000
  recharge_scan_batch_blocks: 1000
  min_subscribe: "100"
  min_withdraw: "10"
  withdraw_fee_rate: 0.06
  # WinSwap V2 Pair (WWIN/USDT) WIN price oracle
  # every 60s cycle; 10 queries per cycle; 5s between queries
  win_pair: "0x15ad085fc866370b59936575565434b14d22281d"
  win_price_oracle_enabled: true
  win_price_poll_seconds: 60
  win_price_queries_per_cycle: 10
  win_price_query_interval_seconds: 5
  # WIN ERC20 鍚堢害锛堟彁鐜版墦娆剧洰鏍囦唬甯侊級
  win_contract: ""
  win_decimals: 18
  win_a_contract: "0x3dce8Ef2646e3082f1e4afbC26Cf747e4e238A8D"
  win_a_decimals: 18
  sdt_contract: "0x314D550572a0fA001B465a9EBc1dd04D834a0688"
  sdt_decimals: 18
  # WIN / AIX-USDT 提现打款共用 withdraw.key
  withdraw_payout_enabled: true
  withdraw_private_key_file: "/opt/aix/secrets/withdraw.key"
  withdraw_payout_queries_per_cycle: 10
  withdraw_payout_query_interval_seconds: 5
  # AVE K 线（密钥用环境变量 AVE_API_KEY 或 ave_api_key_file）
  ave_kline_base_url: "https://prod.ave-api.com"
  ave_kline_token_id: "0x193013574dacbd38bf26ecb654b3fd787b94d216-winchain"
  # 向交易所划转 AIX-USDT（WinBit 入金 POST /v2/winA/aixInbound）
  # 最低额默认 500，管理后台可调。
  exchange_transfer_enabled: true
  exchange_transfer_api_url: "https://api.bitwinex.cloud/v2/winA/aixInbound"
  exchange_transfer_partner_id: "AIX10001"
  exchange_transfer_secret_keys_file: "configs/secrets/partner-AIX10001.test.key"
